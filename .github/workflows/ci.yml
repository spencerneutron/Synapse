name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: sqlite-vec for the retrieval tests (they skip where extensions cannot load)
        run: python -m pip install "sqlite-vec~=0.1.9"
      - name: SessionStart payloads are current and under the 10,000-character cap
        run: python tools/build_context.py --check
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No personal paths or usernames outside examples/
        run: |
          if grep -rnIE '/Users/[A-Za-z]|/home/[a-z][a-z0-9_-]+/|C:\\Users\\[A-Za-z]' \
               --exclude-dir=.git --exclude-dir=examples --exclude-dir=tests .; then
            echo "Replace machine-specific paths with placeholders."; exit 1
          fi

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin and marketplace manifests
        run: claude plugin validate . --strict
